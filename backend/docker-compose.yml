services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: centraldungeon
      MYSQL_USER: centraldungeon
      MYSQL_PASSWORD: centraldungeon
      MYSQL_ROOT_PASSWORD: centraldungeon
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
