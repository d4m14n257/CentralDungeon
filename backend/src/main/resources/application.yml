spring:
  application:
    name: centraldungeon-backend
  # Only a fallback for when nothing else activates a profile - `-Dspring-boot.run.profiles=...`,
  # SPRING_PROFILES_ACTIVE, or --spring.profiles.active (systemd's ExecStart in prod, arquitectura.md
  # §6.2) all take precedence over this. Without it, `./mvnw spring-boot:run` alone starts with zero
  # profiles active, and dev/prod/test never even load - there's no spring.datasource anywhere else.
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        # A page is a page: `?size=100000` cannot turn a paginated endpoint into a full dump
        # (decisiones.md #173). Each endpoint sets its own default with @PageableDefault.
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: userAuth
    caffeine:
      # TTL is the revocation window, not a performance number (arquitectura.md 2.6):
      # explicit @CacheEvict on block/role-change makes it immediate, this is the safety net.
      spec: expireAfterWrite=60s,maximumSize=10000
  security:
    oauth2:
      client:
        registration:
          discord:
            # Spring validates these as non-blank at startup even before any login attempt.
            # The placeholders let the app boot; real Discord login stays broken (as it should)
            # until a real Discord application is created and these are overridden (#38).
            client-id: ${DISCORD_CLIENT_ID:placeholder-create-a-discord-app}
            client-secret: ${DISCORD_CLIENT_SECRET:placeholder-create-a-discord-app}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify, guilds
        provider:
          discord:
            authorization-uri: https://discord.com/api/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

discord:
  guild-id: ${DISCORD_GUILD_ID:}
  invite-url: ${DISCORD_INVITE_URL:}
  # Overridden by the "test" profile to point at the stubbed Discord (TestDiscordController).
  guilds-uri: https://discord.com/api/users/@me/guilds

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  jwt:
    # Dev-only default, 32+ bytes for HS256. Never used as-is outside a local machine (#125).
    secret: ${APP_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
