# Activated alongside dev for the Playwright runs (backend/README.md). Two things live here:
# the login shortcut of TestLoginController, and Discord itself pointed at the stub that
# TestDiscordController serves, so the real OAuth2 handshake can run without a Discord app.
spring:
  jpa:
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: test-discord-client
            client-secret: test-discord-secret
        provider:
          discord:
            authorization-uri: http://localhost:8080/test-discord/oauth2/authorize
            token-uri: http://localhost:8080/test-discord/oauth2/token
            user-info-uri: http://localhost:8080/test-discord/users/@me

# Careful with these two: if backend/.env defines DISCORD_GUILD_ID or DISCORD_INVITE_URL, those win.
# They are environment variables, and Spring's relaxed binding maps them straight onto discord.*,
# above any configuration file, profile included. The values here only apply in a clone with no
# .env - and they suffice, because the stub returns whichever guild id is configured. guilds-uri
# has no environment variable of its own, so nothing ever overrides it.
discord:
  guild-id: test-guild
  invite-url: https://discord.gg/test-invite
  guilds-uri: http://localhost:8080/test-discord/users/@me/guilds

app:
  storage:
    # Out of the repository and out of the dev root: a Playwright run uploads real files and then
    # TestDataController wipes the database, so the blobs it leaves behind are garbage by definition.
    # Pointing this at a temporary directory is what keeps them from piling up next to the source.
    root: ${java.io.tmpdir}/centraldungeon-test-storage

logging:
  level:
    org.testcontainers: INFO
